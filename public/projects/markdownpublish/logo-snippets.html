<!-- ===============================
     MarkDownPublish Logo Snippets
     =============================== -->

<!-- 1) Put this inside <head> -->
<title>MarkDownPublish</title>
<meta name="theme-color" content="#F97316">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

<!-- 2) Full logo: paste inside your top navigation/header -->
<a class="app-brand" href="#" aria-label="MarkDownPublish home">
  <img src="assets/images/markdownpublish-logo.svg"
       alt="MarkDownPublish"
       class="brand-logo logo-light">
  <img src="assets/images/markdownpublish-logo-dark.svg"
       alt="MarkDownPublish"
       class="brand-logo logo-dark">
</a>

<!-- 3) Compact alternative -->
<a class="compact-brand" href="#" aria-label="MarkDownPublish home">
  <img src="assets/images/markdownpublish-icon.svg"
       alt=""
       class="compact-brand-icon icon-light">
  <img src="assets/images/markdownpublish-icon-dark.svg"
       alt=""
       class="compact-brand-icon icon-dark">
  <span class="compact-brand-name">MarkDownPublish</span>
</a>
