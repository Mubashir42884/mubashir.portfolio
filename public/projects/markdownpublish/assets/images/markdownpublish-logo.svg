<svg width="512" height="160" viewBox="0 0 512 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>MarkDownPublish Logo</title>
  <desc>Minimal MarkDownPublish logo with a Markdown M and publish arrow using a red-orange-yellow gradient.</desc>
<defs>
    <linearGradient id="accent" x1="20" y1="20" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="52%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="accentText" x1="178" y1="90" x2="430" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="52%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="144" height="144" rx="32" fill="#FFF8F1"/>
  <rect x="9" y="9" width="142" height="142" rx="31" stroke="url(#accent)" stroke-width="2.5"/>

  <path d="M40 48V108" stroke="#332720" stroke-width="12" stroke-linecap="round"/>
  <path d="M40 50L63 78L86 50V108" stroke="#332720" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M104 57V101" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M89 72L104 57L119 72" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M87 109H121" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>

  <text x="178" y="79"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="42" font-weight="700" fill="#2B211B">MarkDown</text>

  <text x="178" y="121"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="42" font-weight="600" fill="url(#accentText)">Publish</text>
</svg>
